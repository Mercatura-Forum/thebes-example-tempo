[project]
name = "tempo"
default_network = "wan"
chain_id = 2026

[networks.wan]
validators = [
    "https://memphis.mercaturaforum.com/deploy-api/v0",
    "https://memphis.mercaturaforum.com/deploy-api/v1",
    "https://memphis.mercaturaforum.com/deploy-api/v2",
    "https://memphis.mercaturaforum.com/deploy-api/v3",
]
boundary = "https://memphis.mercaturaforum.com"
routing = "smart"

[canisters.tempo]
type = "backend-motoko"
cid = 148286166025860
wasm = "build/tempo.wasm"
build = 'cd motoko && mops install >/dev/null 2>&1 && mkdir -p ../build && MOC="$(ls "$HOME/.cache/mops/moc/1.4.1/moc" 2>/dev/null | head -1)" && "$MOC" --legacy-persistence $(mops sources) -o ../build/tempo.wasm main.mo'

[canisters.web]
type = "frontend"
cid = 59257520488477
wasm = "asset_canister.wasm"
bundle = "dist"
health_check_url = "/index.html"
